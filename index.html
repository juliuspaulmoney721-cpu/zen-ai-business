<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixora</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #050505;
  color: white;
  padding-bottom: 75px;
}

/* HEADER */

.header {
  height: 70px;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: sticky;
  top: 0;
  background: #050505;
  z-index: 10;
}

.logo {
  color: #c44cff;
  font-size: 32px;
  font-weight: bold;
  font-family: Georgia, serif;
}

.nav {
  display: flex;
  align-items: center;
  gap: 18px;
}

.nav button {
  background: none;
  border: none;
  color: #aaa;
  font-size: 24px;
  cursor: pointer;
}

.nav button:hover {
  color: #c44cff;
}

.profile {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #190d22;
  border: 2px solid #2b2030;
  color: #c44cff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
}

/* MAIN */

.container {
  max-width: 700px;
  margin: auto;
}

/* STORIES */

.stories {
  display: flex;
  gap: 18px;
  padding: 22px 15px;
  border-bottom: 1px solid #222;
  overflow-x: auto;
}

.story {
  min-width: 80px;
  text-align: center;
  color: #aaa;
}

.story-circle {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  border: 3px solid #c44cff;
  background: #130d18;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: auto;
  color: #c44cff;
  font-size: 22px;
  font-weight: bold;
}

.story-name {
  margin-top: 7px;
  font-size: 13px;
}

.add-story {
  position: relative;
}

.plus {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 25px;
  height: 25px;
  border-radius: 50%;
  background: #c44cff;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* CREATE */

.create-box {
  margin: 20px 15px;
  padding: 20px;
  border: 1px solid #292929;
  border-radius: 16px;
  background: #0c0c0c;
}

.create-box h3 {
  margin-bottom: 15px;
}

textarea {
  width: 100%;
  min-height: 80px;
  background: #151515;
  border: 1px solid #333;
  border-radius: 10px;
  color: white;
  padding: 12px;
  resize: none;
  outline: none;
}

textarea:focus {
  border-color: #c44cff;
}

.file-label {
  display: inline-block;
  margin-top: 12px;
  padding: 10px 15px;
  border: 1px solid #444;
  border-radius: 10px;
  color: #ccc;
  cursor: pointer;
}

.file-label:hover {
  border-color: #c44cff;
  color: #c44cff;
}

#imageInput {
  display: none;
}

.preview {
  width: 100%;
  max-height: 400px;
  object-fit: contain;
  margin-top: 15px;
  display: none;
  border-radius: 10px;
  background: #111;
}

.post-button {
  margin-top: 12px;
  padding: 11px 22px;
  border: none;
  border-radius: 20px;
  background: #c44cff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

/* POSTS */

#feed {
  padding-bottom: 20px;
}

.post {
  margin: 20px 15px;
  background: #0c0c0c;
  border: 1px solid #292929;
  border-radius: 18px;
  overflow: hidden;
}

.post-header {
  display: flex;
  align-items: center;
  padding: 17px;
  gap: 12px;
}

.avatar {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #190d22;
  color: #c44cff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.username {
  font-weight: bold;
}

.time {
  color: #777;
  font-size: 13px;
  margin-top: 4px;
}

.post-image {
  width: 100%;
  display: block;
  max-height: 650px;
  object-fit: cover;
}

.post-text {
  padding: 15px 18px 5px;
  line-height: 1.5;
}

.actions {
  display: flex;
  gap: 22px;
  padding: 15px 18px 5px;
}

.action {
  background: none;
  border: none;
  color: #aaa;
  font-size: 27px;
  cursor: pointer;
}

.action:hover {
  color: #c44cff;
}

.liked {
  color: #ff3b81 !important;
}

.likes {
  padding: 3px 18px 12px;
  font-weight: bold;
}

.comment-box {
  display: flex;
  padding: 0 18px 18px;
  gap: 8px;
}

.comment-input {
  flex: 1;
  background: #151515;
  border: 1px solid #333;
  border-radius: 20px;
  padding: 10px 14px;
  color: white;
  outline: none;
}

.comment-button {
  border: none;
  background: #c44cff;
  color: white;
  border-radius: 20px;
  padding: 0 15px;
  cursor: pointer;
}

.comments {
  padding: 0 18px 15px;
  color: #bbb;
  font-size: 14px;
}

/* EMPTY */

.empty {
  text-align: center;
  color: #777;
  padding: 40px 20px;
}

/* BOTTOM NAV */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 68px;
  background: #090909;
  border-top: 1px solid #222;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 20;
}

.bottom-nav button {
  border: none;
  background: none;
  color: #888;
  font-size: 24px;
  cursor: pointer;
}

.bottom-nav button.active {
  color: #c44cff;
}

@media (min-width: 700px) {

  .bottom-nav {
    display: none;
  }

  body {
    padding-bottom: 0;
  }
}

@media (max-width: 600px) {

  .header {
    padding: 0 12px;
  }

  .logo {
    font-size: 28px;
  }

  .nav {
    gap: 10px;
  }

  .nav button {
    font-size: 20px;
  }

  .desktop-only {
    display: none;
  }

  .post {
    margin-left: 8px;
    margin-right: 8px;
  }

  .create-box {
    margin-left: 8px;
    margin-right: 8px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Pixora
  </div>

  <nav class="nav">

    <button onclick="goHome()">⌂</button>

    <button onclick="focusSearch()">⌕</button>

    <button onclick="scrollToCreate()">⊞</button>

    <button class="desktop-only">▢</button>

    <button class="desktop-only">♧</button>

    <button onclick="logout()">↪</button>

    <div class="profile" id="profileLetter">
      J
    </div>

  </nav>

</header>


<main class="container">

  <!-- STORIES -->

  <section class="stories">

    <div class="story">

      <div class="story-circle add-story">

        <span id="storyLetter">
          J
        </span>

        <div class="plus">
          +
        </div>

      </div>

      <div class="story-name">
        Your story
      </div>

    </div>


    <div class="story">

      <div class="story-circle">
        T
      </div>

      <div class="story-name">
        Thank God
      </div>

    </div>


    <div class="story">

      <div class="story-circle">
        A
      </div>

      <div class="story-name">
        Alex
      </div>

    </div>


    <div class="story">

      <div class="story-circle">
        M
      </div>

      <div class="story-name">
        Maria
      </div>

    </div>

  </section>


  <!-- CREATE POST -->

  <section
    class="create-box"
    id="createBox"
  >

    <h3>
      Create a post
    </h3>

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>


    <label
      for="imageInput"
      class="file-label"
    >
      🖼️ Add photo
    </label>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      onchange="previewImage(event)"
    >


    <img
      id="preview"
      class="preview"
      alt="Preview"
    >


    <br>

    <button
      class="post-button"
      onclick="publishPost()"
    >
      Publish
    </button>

  </section>


  <!-- FEED -->

  <section id="feed"></section>

</main>


<!-- MOBILE NAV -->

<nav class="bottom-nav">

  <button
    class="active"
    onclick="goHome()"
  >
    ⌂
  </button>

  <button onclick="focusSearch()">
    ⌕
  </button>

  <button onclick="scrollToCreate()">
    ⊞
  </button>

  <button>
    ♡
  </button>

  <button onclick="logout()">
    ↪
  </button>

</nav>


<script>

/* GET USER */

let user =
  JSON.parse(
    localStorage.getItem("pixoraUser")
  );


/*
  If there is no account,
  send the visitor to signup.
*/

if (!user) {

  window.location.href =
    "signup.html";

}


/* USER DISPLAY */

if (user) {

  const letter =
    user.username
      ? user.username.charAt(0).toUpperCase()
      : user.name.charAt(0).toUpperCase();

  document.getElementById(
    "profileLetter"
  ).textContent = letter;

  document.getElementById(
    "storyLetter"
  ).textContent = letter;

}


/* IMAGE PREVIEW */

function previewImage(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }

  const reader =
    new FileReader();

  reader.onload =
    function(e) {

      const preview =
        document.getElementById("preview");

      preview.src =
        e.target.result;

      preview.style.display =
        "block";

    };

  reader.readAsDataURL(file);

}


/* CREATE POST */

function publishPost() {

  const text =
    document
      .getElementById("postText")
      .value
      .trim();

  const imageInput =
    document.getElementById("imageInput");

  const file =
    imageInput.files[0];


  if (!text && !file) {

    alert(
      "Write something or add a photo."
    );

    return;

  }


  if (file) {

    const reader =
      new FileReader();

    reader.onload =
      function(e) {

        savePost(
          text,
          e.target.result
        );

      };

    reader.readAsDataURL(file);

  } else {

    savePost(
      text,
      null
    );

  }

}


/* SAVE POST */

function savePost(text, image) {

  const posts =
    JSON.parse(
      localStorage.getItem(
        "pixoraPosts"
      )
    ) || [];


  const post = {

    id: Date.now(),

    username:
      user.username || user.name,

    text: text,

    image: image,

    likes: 0,

    comments: [],

    time: "Just now"

  };


  posts.unshift(post);


  localStorage.setItem(
    "pixoraPosts",
    JSON.stringify(posts)
  );


  document.get
