<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pixora Social App</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050505;
      color: white;
    }

    /* HEADER */
    .header {
      height: 70px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      position: sticky;
      top: 0;
      background: rgba(5, 5, 5, 0.96);
      z-index: 10;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #c44cff;
      font-family: Georgia, serif;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .nav button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 25px;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav button:hover {
      color: #c44cff;
      transform: scale(1.1);
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #170d20;
      border: 2px solid #261c2c;
      color: #c44cff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    /* MAIN */
    .container {
      max-width: 700px;
      margin: auto;
    }

    /* STORIES */
    .stories {
      display: flex;
      gap: 18px;
      padding: 25px 15px;
      border-bottom: 1px solid #222;
      overflow-x: auto;
    }

    .story {
      min-width: 85px;
      text-align: center;
      color: #aaa;
    }

    .story-circle {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: 3px solid #c44cff;
      background: #130d18;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto;
      font-size: 24px;
      color: #c44cff;
    }

    .story-name {
      margin-top: 8px;
      font-size: 13px;
    }

    .add-story {
      position: relative;
    }

    .plus {
      position: absolute;
      bottom: 0;
      right: 2px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #c44cff;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border: 2px solid #050505;
    }

    /* POST */
    .post {
      margin: 25px 15px;
      background: #0c0c0c;
      border: 1px solid #292929;
      border-radius: 20px;
      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 18px;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #190c22;
      color: #c44cff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .username {
      font-weight: bold;
      font-size: 18px;
    }

    .time {
      color: #777;
      font-size: 14px;
      margin-top: 4px;
    }

    .post-image {
      width: 100%;
      display: block;
      background: white;
    }

    .post-actions {
      display: flex;
      gap: 25px;
      padding: 18px;
    }

    .action {
      border: none;
      background: none;
      color: #aaa;
      font-size: 28px;
      cursor: pointer;
    }

    .action:hover {
      color: #c44cff;
    }

    .liked {
      color: #ff3b81 !important;
    }

    .likes {
      padding: 0 20px 10px;
      font-weight: bold;
    }

    .caption {
      padding: 0 20px 20px;
      color: #ddd;
    }

    /* CREATE */
    .create-box {
      margin: 20px 15px;
      padding: 20px;
      border: 1px solid #292929;
      border-radius: 15px;
      background: #0c0c0c;
    }

    .create-box h3 {
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      resize: none;
      background: #151515;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    .post-button {
      margin-top: 10px;
      padding: 10px 22px;
      border: none;
      border-radius: 20px;
      background: #c44cff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      display: none;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .header {
        padding: 0 15px;
      }

      .logo {
        font-size: 27px;
      }

      .nav {
        gap: 12px;
      }

      .nav button {
        font-size: 21px;
      }

      .nav .desktop-only {
        display: none;
      }

      .container {
        width: 100%;
      }

      .post {
        margin: 18px 8px;
        border-radius: 15px;
      }

      .bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 65px;
        background: #090909;
        border-top: 1px solid #222;
        justify-content: space-around;
        align-items: center;
        z-index: 20;
      }

      .bottom-nav button {
        background: none;
        border: none;
        color: #888;
        font-size: 23px;
      }

      .bottom-nav button.active {
        color: #c44cff;
      }

      body {
        padding-bottom: 65px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div class="logo">
      Pixora
    </div>

    <nav class="nav">
      <button onclick="home()">⌂</button>
      <button onclick="search()">⌕</button>
      <button onclick="videos()">▣</button>
      <button onclick="create()">⊞</button>
      <button class="desktop-only">▢</button>
      <button class="desktop-only">♧</button>

      <div class="profile">
        J
      </div>
    </nav>

  </header>


  <main class="container">

    <!-- STORIES -->
    <section class="stories">

      <div class="story">
        <div class="story-circle add-story">
          J
          <div class="plus">+</div>
        </div>

        <div class="story-name">
          Your story
        </div>
      </div>

      <div class="story">
        <div class="story-circle">
          T
        </div>

        <div class="story-name">
          Thank God
        </div>
      </div>

      <div class="story">
        <div class="story-circle">
          A
        </div>

        <div class="story-name">
          Alex
        </div>
      </div>

      <div class="story">
        <div class="story-circle">
          M
        </div>

        <div class="story-name">
          Maria
        </div>
      </div>

    </section>


    <!-- CREATE POST -->
    <section class="create-box" id="createBox">

      <h3>Create a post</h3>

      <textarea
        id="postText"
        placeholder="What's on your mind?"
      ></textarea>

      <button
        class="post-button"
        onclick="publishPost()"
      >
        Publish
      </button>

    </section>


    <!-- POST -->
    <article class="post">

      <div class="post-header">

        <div class="avatar">
          T
        </div>

        <div>
          <div class="username">
            Thank God
          </div>

          <div class="time">
            14 days ago
          </div>
        </div>

      </div>


      <!-- Replace this image with your own image -->
      <img
        class="post-image"
        src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=900&q=80"
        alt="T-shirt"
      />


      <div class="post-actions">

        <button
          class="action"
          onclick="likePost(this)"
        >
          ♡
        </button>

        <button
          class="action"
          onclick="commentPost()"
        >
          ♡
        </button>

      </div>


      <div class="likes" id="likes">
        1 like
      </div>

      <div class="caption">
        I love my wife ❤️
      </div>

    </article>

  </main>


  <!-- MOBILE BOTTOM NAV -->
  <div class="bottom-nav">

    <button class="active">
      ⌂
    </button>

    <button>
      ⌕
    </button>

    <button onclick="create()">
      ⊞
    </button>

    <button>
      ♡
    </button>

    <button>
      J
    </button>

  </div>


  <script>

    let likes = 1;

    function likePost(button) {

      button.classList.toggle("liked");

      if (button.classList.contains("liked")) {
        likes++;
        button.innerHTML = "♥";
      } else {
        likes--;
        button.innerHTML = "♡";
      }

      document.getElementById("likes").innerText =
        likes + (likes === 1 ? " like" : " likes");
    }


    function commentPost() {

      const comment = prompt(
        "Write your comment:"
      );

      if (comment) {
        alert(
          "Comment posted: " + comment
        );
      }

    }


    function publishPost() {

      const text =
        document.getElementById("postText").value;

      if (!text.trim()) {

        alert(
          "Please write something first."
        );

        return;
      }

      alert(
        "Post published successfully!"
      );

      document.getElementById("postText").value = "";

    }


    function create() {

      document
        .getElementById("createBox")
        .scrollIntoView({
          behavior: "smooth"
        });

    }


    function home() {

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function search() {

      alert(
        "Search feature coming next."
      );

    }


    function videos() {

      alert(
        "Video section coming next."
      );

    }

  </script>

</body>
</html>
